name: coride
description: "CoRide - Campus-Centric Ridesharing & Carpooling Mobile Application for Daffodil International University"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  provider: ^6.1.2
  dio: ^5.4.3
  socket_io_client: ^3.0.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  latlong2: ^0.9.1
  flutter_animate: ^4.5.2
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/scenic_commute_view.png
